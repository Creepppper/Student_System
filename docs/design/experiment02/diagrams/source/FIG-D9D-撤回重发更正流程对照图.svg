<rect x="25" y="578" width="1450" height="50" rx="6" fill="#F8FAFC" stroke="#9AA7B4"/><text x="35" y="598" font-family="SimHei" font-size="12" fill="#374151">FIG-D9D 为三条计划分支对照（不是生命周期状态机）：撤回不删历史；重发版本+1；更正保持 PUB_PUBLISHED 并生成新版本。</text><text x="35" y="614" font-family="SimHei" font-size="12" fill="#374151">所有状态/版本/审计在同一事务，失败回滚；并发冲突 409；学生只读当前 PUB_PUBLISHED。</text></svg>