<rect x="35" y="860" width="1630" height="60" rx="6" fill="#F8FAFC" stroke="#9AA7B4"/><text x="45" y="880" font-family="SimHei" font-size="10" fill="#374151">D9D 为三条计划分支；撤回不删除历史，重发版本+1，更正保持 PUB_PUBLISHED 且生成新不可变版本。</text><text x="45" y="896" font-family="SimHei" font-size="10" fill="#374151">所有状态/版本/审计在同一事务；并发冲突 409；学生端只读当前 PUB_PUBLISHED。</text></svg>