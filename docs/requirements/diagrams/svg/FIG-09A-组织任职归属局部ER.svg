<text xml:space="preserve" text-anchor="start" x="476.35" y="-59.96" font-family="Noto Sans CJK SC" font-size="8.20">约束：</text>
<text xml:space="preserve" text-anchor="start" x="476.35" y="-47.21" font-family="Noto Sans CJK SC" font-size="8.20">• 每班同一时刻最多 1 条有效任职（结束日期为空或覆盖当前日期）。</text>
<text xml:space="preserve" text-anchor="start" x="476.35" y="-34.46" font-family="Noto Sans CJK SC" font-size="8.20">• 1 名班主任可有多条任职记录，覆盖多个班级。</text>
<text xml:space="preserve" text-anchor="start" x="476.35" y="-21.71" font-family="Noto Sans CJK SC" font-size="8.20">• 学生班级归属按学年保留；转班结束旧记录，不覆盖历史。</text>
<text xml:space="preserve" text-anchor="start" x="476.35" y="-8.96" font-family="Noto Sans CJK SC" font-size="8.20">• 班主任更换不改变历史成绩任务的第一责任人快照。</text>
