<text xml:space="preserve" text-anchor="start" x="124.9" y="-72.71" font-family="Noto Sans CJK SC" font-size="8.20">约束：</text>
<text xml:space="preserve" text-anchor="start" x="124.9" y="-59.96" font-family="Noto Sans CJK SC" font-size="8.20">• 成绩任务唯一 (考试,班级,科目)；一个任务对应一组成绩记录。</text>
<text xml:space="preserve" text-anchor="start" x="124.9" y="-47.21" font-family="Noto Sans CJK SC" font-size="8.20">• 成绩记录唯一 (任务,学生)；缺考/未录入/零分是状态与值组合。</text>
<text xml:space="preserve" text-anchor="start" x="124.9" y="-34.46" font-family="Noto Sans CJK SC" font-size="8.20">• 班级发布唯一 (考试,班级)，版本随更正/重发递增。</text>
<text xml:space="preserve" text-anchor="start" x="124.9" y="-21.71" font-family="Noto Sans CJK SC" font-size="8.20">• 第一责任人为班主任，任务生成时快照；换班主任不改历史快照。</text>
<text xml:space="preserve" text-anchor="start" x="124.9" y="-8.96" font-family="Noto Sans CJK SC" font-size="8.20">• 审计按 entity_type/entity_id 多态引用，不声明物理外键。</text>
